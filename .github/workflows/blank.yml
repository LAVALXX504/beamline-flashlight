name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Generate Android project with Capacitor
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Beamline Flashlight" "com.beamline.flashlight" --web-dir dist
          npx cap add android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("android.permission.CAMERA")) {
              xml = xml.replace(
                "<application",
                "<uses-permission android:name=\"android.permission.CAMERA\" />\n    <application"
              );
              fs.writeFileSync(p, xml);
            }
          '

      - name: Build Android APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK (for direct phone install)
        uses: actions/upload-artifact@v4
        with:
          name: beamline-flashlight-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (for app stores)
        uses: actions/upload-artifact@v4
        with:
          name: beamline-flashlight-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
